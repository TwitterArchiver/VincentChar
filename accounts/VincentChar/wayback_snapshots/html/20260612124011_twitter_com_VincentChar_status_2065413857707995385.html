  日剧里常常有句台词是“真是个温柔的人啊”。
  <br/>
  怎么说呢我太喜欢温柔的人了。
  <br/>
  是雨天行车路过水坑会故意放慢速度的人，
  <br/>
  是关门时轻手轻脚的人，
  <br/>
  是会将用过的纸巾好好折起再扔掉的人，
  <br/>
  是能照顾他人情绪的人，
  <br/>
  是能化解他人尴尬的人，
  <br/>
  是像粥一样的人，
  <br/>
  希望能和温柔的人交朋友，带着音乐和美食。
